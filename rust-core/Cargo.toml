[workspace]
resolver = "2"
members = [
    "crates/neurons",
    "crates/network",
    "crates/plasticity",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
