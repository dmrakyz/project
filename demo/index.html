<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SNN · AdEx Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0d1117; color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', ui-monospace, monospace;
      overflow: hidden; }
    body { display: flex; flex-direction: column; }

    #hd {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 5px 12px; background: #161b22; border-bottom: 1px solid #21262d; min-height: 36px;
    }
    #hd h1 { font-size: 12px; font-weight: 700; color: #58a6ff; white-space: nowrap; }
    #stats { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: #8b949e; flex: 1; }
    .sv { color: #e6edf3; font-weight: 600; }
    #legend { font-size: 10px; display: flex; gap: 6px; white-space: nowrap; }
    .le { color: #58a6ff; } .li { color: #f0883e; }

    #cvs-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 5px 5px 3px; min-height: 0; }
    .cw { position: relative; min-height: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%;
      background: #010409; border: 1px solid #21262d; border-radius: 4px; display: block; }

    #ft {
      flex-shrink: 0; display: flex; align-items: center; flex-wrap: wrap;
      gap: 5px; padding: 5px 10px; background: #161b22; border-top: 1px solid #21262d; min-height: 38px;
    }
    button { padding: 5px 14px; border-radius: 5px; border: 1px solid #30363d;
      background: #21262d; color: #e6edf3; font-size: 12px; font-family: inherit;
      cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; min-height: 28px; }
    button:active { background: #30363d; }
    #playBtn { background: #1f6feb; border-color: #388bfd; min-width: 76px; }
    #playBtn:active { background: #388bfd; }
    select { padding: 4px 5px; border-radius: 5px; border: 1px solid #30363d;
      background: #21262d; color: #e6edf3; font-size: 12px; font-family: inherit; min-height: 28px; }
    label { font-size: 11px; color: #8b949e; }
    .spacer { flex: 1; }
  </style>
</head>
<body>

<div id="hd">
  <h1>SNN · AdEx</h1>
  <div id="stats">
    <div>t=<span class="sv" id="simT">0</span>ms</div>
    <div>Hz=<span class="sv" id="popHz">–</span></div>
    <div>⟨w<sub>EE</sub>⟩=<span class="sv" id="meanW">–</span></div>
  </div>
  <div id="legend"><span class="le">■ E×80</span><span class="li">■ I×20</span></div>
</div>

<div id="cvs-wrap">
  <div class="cw" style="flex:3"><canvas id="raster"></canvas></div>
  <div class="cw" style="flex:1"><canvas id="rates"></canvas></div>
</div>

<div id="ft">
  <button id="playBtn">▶ Play</button>
  <button id="resetBtn">↺ Reset</button>
  <div class="spacer"></div>
  <label>Speed</label>
  <select id="speed">
    <option value="1">1×</option>
    <option value="10" selected>10×</option>
    <option value="50">50×</option>
    <option value="100">100×</option>
  </select>
  <label>Drive</label>
  <select id="drive">
    <option value="tonic" selected>Tonic</option>
    <option value="burst">Burst</option>
    <option value="off">Silent</option>
  </select>
</div>

<!-- Compiled bundle from actual TypeScript packages:
     @snn/neurons, @snn/network, @snn/plasticity, @snn/observability, @snn/config, @snn/types -->
<script src="bundle.js"></script>
<script>
'use strict';

// SNN is the IIFE global exported by bundle.js (built from demo/main.ts)
// It wraps the actual platform packages: AdExModel, buildCSRStore, STDPRule, etc.
const { init, step, meanEEWeight, popRateHz, raster, N_EXC, N_TOTAL } = SNN;

// ── Canvas setup ──────────────────────────────────────────────────────────────
const rasterCanvas = document.getElementById('raster');
const ratesCanvas  = document.getElementById('rates');
const rcx = rasterCanvas.getContext('2d');
const rtx  = ratesCanvas.getContext('2d');
const DPR  = Math.min(window.devicePixelRatio || 1, 2);
const RASTER_WIN = 400; // ms

function fitCanvas(c) {
  const r = c.parentElement.getBoundingClientRect();
  const nw = Math.floor(r.width  * DPR);
  const nh = Math.floor(r.height * DPR);
  if (c.width !== nw || c.height !== nh) { c.width = nw; c.height = nh; }
}

// ── Rendering ─────────────────────────────────────────────────────────────────
function drawRaster() {
  fitCanvas(rasterCanvas);
  const ctx = rcx, W = rasterCanvas.width, H = rasterCanvas.height;
  ctx.clearRect(0, 0, W, H);

  const tNow = SNN.simT;
  const tMin = tNow - RASTER_WIN;
  const xScale = W / RASTER_WIN, yScale = H / N_TOTAL;
  const dotH = Math.max(1.5, yScale * 0.8);

  // 100ms grid
  ctx.strokeStyle = '#1c2128'; ctx.lineWidth = 1;
  for (let ms = 0; ms < RASTER_WIN; ms += 100) {
    const x = Math.round(ms * xScale) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  // E/I separator
  const ySep = Math.round((N_EXC / N_TOTAL) * H) + 0.5;
  ctx.strokeStyle = '#30363d'; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(0, ySep); ctx.lineTo(W, ySep); ctx.stroke();
  ctx.setLineDash([]);

  // Spikes — two colour passes to avoid per-spike fillStyle calls
  const buf = raster;
  for (let pass = 0; pass < 2; pass++) {
    ctx.fillStyle = pass === 0 ? '#58a6ff' : '#f0883e';
    const lo = pass === 0 ? 0 : N_EXC, hi = pass === 0 ? N_EXC : N_TOTAL;
    for (let k = 0; k < buf.length; k += 2) {
      const t = buf[k]; if (t < tMin) continue;
      const id = buf[k + 1]; if (id < lo || id >= hi) continue;
      ctx.fillRect(Math.floor((t - tMin) * xScale), Math.floor(id * yScale), 2, dotH);
    }
  }

  // "Now" line
  ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W - 1, 0); ctx.lineTo(W - 1, H); ctx.stroke();

  // Labels
  const fs = Math.max(9, Math.floor(W * 0.018));
  ctx.font = fs + 'px monospace'; ctx.fillStyle = '#30363d';
  ctx.fillText('E', 3, ySep - 3);
  ctx.fillText('I', 3, H - 3);
  ctx.fillText('←400ms', W - fs * 5, H - 3);
}

function drawRates() {
  fitCanvas(ratesCanvas);
  const ctx = rtx, W = ratesCanvas.width, H = ratesCanvas.height;
  ctx.clearRect(0, 0, W, H);

  const tMin = SNN.simT - 200;
  const cnt = new Float32Array(N_TOTAL);
  const buf = raster;
  for (let k = 0; k < buf.length; k += 2)
    if (buf[k] >= tMin) cnt[buf[k + 1]]++;

  const toHz = 1000 / 200, maxHz = 100, barW = W / N_TOTAL;
  for (let i = 0; i < N_TOTAL; i++) {
    const h = Math.min(H, (cnt[i] * toHz / maxHz) * H);
    ctx.fillStyle = i < N_EXC ? '#1f6feb22' : '#da363322';
    ctx.fillRect(i * barW, 0, Math.max(1, barW - 0.5), H);
    ctx.fillStyle = i < N_EXC ? '#1f6feb' : '#da3633';
    ctx.fillRect(i * barW, H - h, Math.max(1, barW - 0.5), h);
  }

  const fs = Math.max(8, Math.floor(H * 0.28));
  ctx.font = fs + 'px monospace'; ctx.fillStyle = '#30363d';
  ctx.fillText('100Hz', 2, fs + 1);
}

// ── Stats ─────────────────────────────────────────────────────────────────────
let lastStatT = 0;
function updateStats() {
  if (SNN.simT - lastStatT < 200) return;
  lastStatT = SNN.simT;
  document.getElementById('simT').textContent  = SNN.simT.toFixed(0);
  document.getElementById('popHz').textContent = popRateHz(200).toFixed(1);
  document.getElementById('meanW').textContent = meanEEWeight().toFixed(2) + 'nS';
}

// ── Main loop ─────────────────────────────────────────────────────────────────
let running = false, raf = null, lastWall = 0;

function frame(now) {
  if (!running) { raf = null; return; }
  const wall = lastWall ? Math.min(now - lastWall, 50) : 16;
  lastWall = now;
  const speed = +document.getElementById('speed').value;
  const drive = document.getElementById('drive').value;
  const steps = Math.max(1, Math.floor(Math.min(wall * speed, 200) / 0.1));
  for (let s = 0; s < steps; s++) step(drive);
  drawRaster(); drawRates(); updateStats();
  raf = requestAnimationFrame(frame);
}

function setRunning(on) {
  running = on;
  document.getElementById('playBtn').textContent = on ? '⏸ Pause' : '▶ Play';
  if (on && !raf) { lastWall = 0; raf = requestAnimationFrame(frame); }
}

document.getElementById('playBtn') .addEventListener('click', () => setRunning(!running));
document.getElementById('resetBtn').addEventListener('click', () => {
  const was = running; setRunning(false);
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  init(42); lastStatT = 0;
  ['simT','popHz','meanW'].forEach(id => document.getElementById(id).textContent = id === 'simT' ? '0' : '–');
  drawRaster(); drawRates();
  if (was) setRunning(true);
});

window.addEventListener('resize', () => { drawRaster(); drawRates(); });

// Boot
init(42);
drawRaster(); drawRates();
setRunning(true);
</script>
</body>
</html>
